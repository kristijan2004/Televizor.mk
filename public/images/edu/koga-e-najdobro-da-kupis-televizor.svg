<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
<style>
.band { animation: band 10s infinite; }
.b2 { animation-delay: 0.6s } .b3 { animation-delay: 1.2s } .b4 { animation-delay: 1.8s }
@keyframes band { 0% { opacity: 0 } 6%, 92% { opacity: 1 } 100% { opacity: 0 } }
.price { stroke-dasharray: 1; animation: draw 10s infinite; }
@keyframes draw { 0%, 25% { stroke-dashoffset: 1 } 70%, 100% { stroke-dashoffset: 0 } }
.start { animation: show 10s infinite; }
@keyframes show { 0%, 24% { opacity: 0 } 27%, 94% { opacity: 1 } 100% { opacity: 0 } }
.end { animation: showEnd 10s infinite; }
@keyframes showEnd { 0%, 68% { opacity: 0 } 72%, 94% { opacity: 1 } 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect width="1600" height="900" fill="#f4f4fa"/>
<text x="160" y="120" font-size="44" font-weight="800" fill="#1b1b2f">Годишниот циклус на цените на телевизорите</text>
<g class="band b1"><rect x="160" y="210" width="330" height="490" fill="#e9eaf6"/>
<text x="325" y="248" font-size="25" font-weight="700" fill="#1b1b2f" text-anchor="middle">Ланските поевтинуваат</text>
<text x="325" y="280" font-size="21" fill="#5d5d78" text-anchor="middle">добра цена за стар модел</text></g><g class="band b2"><rect x="490" y="210" width="330" height="490" fill="#f7e9e9"/>
<text x="655" y="248" font-size="25" font-weight="700" fill="#1b1b2f" text-anchor="middle">Нов модел, полна цена</text>
<text x="655" y="280" font-size="21" fill="#5d5d78" text-anchor="middle">најлош момент за нов</text></g><g class="band b3"><rect x="820" y="210" width="440" height="490" fill="#efeff7"/>
<text x="1040" y="248" font-size="25" font-weight="700" fill="#1b1b2f" text-anchor="middle">Цената паѓа</text>
<text x="1040" y="280" font-size="21" fill="#5d5d78" text-anchor="middle">откако старите ќе се распродадат</text></g><g class="band b4"><rect x="1260" y="210" width="220" height="490" fill="#e5f1ea"/>
<text x="1370" y="248" font-size="25" font-weight="700" fill="#1b1b2f" text-anchor="middle">Попусти</text>
<text x="1370" y="280" font-size="21" fill="#5d5d78" text-anchor="middle">најниска цена</text></g><line x1="160" y1="700" x2="1480" y2="700" stroke="#5d5d78" stroke-width="3"/><line x1="160" y1="210" x2="160" y2="700" stroke="#5d5d78" stroke-width="3"/><text x="136" y="475" font-size="26" fill="#5d5d78" text-anchor="middle" transform="rotate(-90 136 475)">цена на годинешниот модел</text><text x="215" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Јан</text><text x="325" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Фев</text><text x="435" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Мар</text><text x="545" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Апр</text><text x="655" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Мај</text><text x="765" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Јун</text><text x="875" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Јул</text><text x="985" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Авг</text><text x="1095" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Сеп</text><text x="1205" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Окт</text><text x="1315" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Ное</text><text x="1425" y="742" font-size="26" fill="#1b1b2f" text-anchor="middle">Дек</text><path class="price" d="M490,370 C655,370 655,390 820,390 C985,390 985,545 1150,545 C1276.5,545 1276.5,612 1403,612 C1441.5,612 1441.5,604 1480,604" pathLength="1" fill="none" stroke="#242582" stroke-width="7" stroke-linecap="round"/><g class="start"><circle cx="490" cy="370" r="11" fill="#242582"/><text x="510" y="350" font-size="24" font-weight="700" fill="#242582">излегува на пазарот</text></g><g class="end"><circle cx="1403" cy="612" r="11" fill="#242582"/></g>
<text x="160" y="840" font-size="22" fill="#5d5d78">Поедноставен приказ, без конкретни цени</text></svg>