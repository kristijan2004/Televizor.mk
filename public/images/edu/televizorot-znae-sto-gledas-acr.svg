<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
<style>
.scan { animation: scan 3s linear infinite; }
@keyframes scan { 0% { transform: translateY(0) } 100% { transform: translateY(186px) } }
.fp { animation: pulse 3s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.55 } }
.pk { animation: pk 3s linear infinite; }
.pk.b { animation-delay: -1s; } .pk.c { animation-delay: -2s; }
@keyframes pk { 0% { transform: translateX(0); opacity: 0 } 10% { opacity: 1 } 90% { opacity: 1 } 100% { transform: translateX(170px); opacity: 0 } }
.ad { animation: ad 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.ad.b { animation-delay: -1.5s; }
@keyframes ad { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.04) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect width="1600" height="900" fill="#f4f4fa"/><defs><clipPath id="tvscr"><rect x="150" y="240" width="300" height="190" rx="8"/></clipPath></defs>
<text x="800" y="150" font-size="44" font-weight="800" fill="#1b1b2f" text-anchor="middle">Како телевизорот препознава што гледаш</text>
<rect x="130" y="220" width="340" height="230" rx="16" fill="#1b1b2f"/><rect x="150" y="240" width="300" height="190" rx="8" fill="#242582"/>
