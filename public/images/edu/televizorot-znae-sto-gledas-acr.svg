<g class="ad "><rect x="1130" y="230" width="190" height="110" rx="14" fill="#fff" stroke="#d9d9e6" stroke-width="3"/><rect x="1148" y="250" width="70" height="70" rx="10" fill="#d64545"/><rect x="1234" y="258" width="68" height="12" rx="6" fill="#d9d9e6"/><rect x="1234" y="282" width="52" height="12" rx="6" fill="#d9d9e6"/></g><g class="ad b"><rect x="1180" y="370" width="190" height="110" rx="14" fill="#fff" stroke="#d9d9e6" stroke-width="3"/><rect x="1198" y="390" width="70" height="70" rx="10" fill="#e3972b"/><rect x="1284" y="398" width="68" height="12" rx="6" fill="#d9d9e6"/><rect x="1284" y="422" width="52" height="12" rx="6" fill="#d9d9e6"/></g>
<circle cx="300" cy="600" r="26" fill="#242582"/><text x="300" y="610" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="300" y="670" font-size="30" font-weight="700" fill="#1b1b2f" text-anchor="middle">Отпечаток од екранот</text>
<text x="300" y="710" font-size="24" fill="#5d5d78" text-anchor="middle">мал примерок од сликата или звукот</text>
<circle cx="800" cy="600" r="26" fill="#242582"/><text x="800" y="610" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="800" y="670" font-size="30" font-weight="700" fill="#1b1b2f" text-anchor="middle">Споредба со база</text>
<text x="800" y="710" font-size="24" fill="#5d5d78" text-anchor="middle">кој филм, емисија или реклама е</text>
<circle cx="1290" cy="600" r="26" fill="#242582"/><text x="1290" y="610" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="1290" y="670" font-size="30" font-weight="700" fill="#1b1b2f" text-anchor="middle">Податоци за реклами</text>
<text x="1290" y="710" font-size="24" fill="#5d5d78" text-anchor="middle">насочени кон тебе и семејството</text></svg>