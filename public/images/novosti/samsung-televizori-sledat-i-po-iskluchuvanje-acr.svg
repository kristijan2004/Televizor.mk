<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
<rect width="1600" height="900" fill="#f4f4fa"/>
<text x="800" y="110" font-size="46" font-weight="800" fill="#1b1b2f" text-anchor="middle">Дали телевизорот престанува да те следи</text>
<text x="800" y="168" font-size="46" font-weight="800" fill="#1b1b2f" text-anchor="middle">кога ќе го исклучиш ACR?</text>
<g font-size="34">
<rect x="200" y="215" width="1200" height="70" rx="14" fill="#e3f5ea"/>
<circle cx="250" cy="250" r="22" fill="#1e8e4e"/><path d="M239 250 l8 9 l15 -18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="295" y="262" font-weight="700" fill="#1b1b2f">LG (webOS)</text><text x="1370" y="262" fill="#1e6b3e" text-anchor="end">го почитува исклучувањето</text>
<rect x="200" y="297" width="1200" height="70" rx="14" fill="#e3f5ea"/>
<circle cx="250" cy="332" r="22" fill="#1e8e4e"/><path d="M239 332 l8 9 l15 -18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="295" y="344" font-weight="700" fill="#1b1b2f">Sony (Google TV)</text><text x="1370" y="344" fill="#1e6b3e" text-anchor="end">го почитува исклучувањето</text>
<rect x="200" y="379" width="1200" height="70" rx="14" fill="#e3f5ea"/>
<circle cx="250" cy="414" r="22" fill="#1e8e4e"/><path d="M239 414 l8 9 l15 -18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="295" y="426" font-weight="700" fill="#1b1b2f">Hisense (VIDAA)</text><text x="1370" y="426" fill="#1e6b3e" text-anchor="end">го почитува исклучувањето</text>
<rect x="200" y="461" width="1200" height="70" rx="14" fill="#e3f5ea"/>
<circle cx="250" cy="496" r="22" fill="#1e8e4e"/><path d="M239 496 l8 9 l15 -18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="295" y="508" font-weight="700" fill="#1b1b2f">Amazon Fire TV</text><text x="1370" y="508" fill="#1e6b3e" text-anchor="end">го почитува исклучувањето</text>
<rect x="200" y="543" width="1200" height="70" rx="14" fill="#fff4dc"/>
<circle cx="250" cy="578" r="22" fill="#d99a00"/><rect x="238" y="574" width="24" height="8" rx="3" fill="#fff"/>
<text x="295" y="590" font-weight="700" fill="#1b1b2f">Roku</text><text x="1370" y="590" fill="#8a6100" text-anchor="end">само делумно</text>
<rect x="200" y="625" width="1200" height="70" rx="14" fill="#fde4e4"/>
<circle cx="250" cy="660" r="22" fill="#c62828"/><path d="M241 651 l18 18 M259 651 l-18 18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<text x="295" y="672" font-weight="700" fill="#1b1b2f">Samsung (Tizen)</text><text x="1370" y="672" fill="#a12020" text-anchor="end">сообраќај и по исклучувањето</text>
<rect x="200" y="707" width="1200" height="70" rx="14" fill="#fde4e4"/>
<circle cx="250" cy="742" r="22" fill="#c62828"/><path d="M241 733 l18 18 M259 733 l-18 18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<text x="295" y="754" font-weight="700" fill="#1b1b2f">Vizio (SmartCast)</text><text x="1370" y="754" fill="#a12020" text-anchor="end">сообраќај во сите тестови</text>
</g>
<text x="800" y="840" font-size="26" fill="#55556a" text-anchor="middle">Извор: Northeastern University, „Watching the Watchers“ (2026) · 12 телевизори, 5.943 тестови</text>
</svg>
