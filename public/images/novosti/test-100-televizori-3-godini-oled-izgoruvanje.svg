<text x="460" y="580" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">ВЕСТИ</text>
<rect x="565" y="565" width="380" height="12" rx="6" fill="#ffffff" opacity="0.8"/><rect x="975" y="565" width="200" height="12" rx="6" fill="#ffffff" opacity="0.8"/><rect x="1065" y="189" width="120" height="56" rx="10" fill="#ffffff"/><text x="1125" y="227" font-size="28" font-weight="800" fill="#242582" text-anchor="middle">ТВ 24</text></g>
</g>
<rect x="760" y="640" width="80" height="26" rx="6" fill="#1b1b2f"/><rect x="650" y="665" width="300" height="14" rx="7" fill="#1b1b2f"/>
<g class="tag1"><text x="800" y="760" font-size="34" font-weight="700" fill="#1b1b2f" text-anchor="middle">Сликата постојано се менува, лентата и логото стојат</text></g>
<g class="tag2"><text x="800" y="760" font-size="34" font-weight="700" fill="#d64545" text-anchor="middle">По илјадници часови: трага токму таму каде што стоеја</text></g>
<text x="800" y="810" font-size="26" fill="#5d5d78" text-anchor="middle">Изгорување кај OLED: проблем само со слика што никогаш не се менува</text></svg>