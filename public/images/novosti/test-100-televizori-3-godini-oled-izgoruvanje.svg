<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
<style>
.s1 { animation: sc1 12s infinite; } .s2 { animation: sc2 12s infinite; } .s3 { animation: sc3 12s infinite; }
@keyframes sc1 { 0%, 21% { opacity: 1 } 24%, 97% { opacity: 0 } 100% { opacity: 1 } }
@keyframes sc2 { 0%, 21% { opacity: 0 } 24%, 44% { opacity: 1 } 47%, 100% { opacity: 0 } }
@keyframes sc3 { 0%, 44% { opacity: 0 } 47%, 70% { opacity: 1 } 74%, 100% { opacity: 0 } }
.overlay, .tag1 { animation: overlay 12s infinite; }
@keyframes overlay { 0%, 70% { opacity: 1 } 74%, 96% { opacity: 0 } 100% { opacity: 1 } }
.test, .tag2 { opacity: 0; animation: test 12s infinite; }
@keyframes test { 0%, 70% { opacity: 0 } 74%, 96% { opacity: 1 } 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect width="1600" height="900" fill="#f4f4fa"/><defs>
<linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a7a"/><stop offset="0.6" stop-color="#e2694b"/><stop offset="1" stop-color="#f3b45b"/></linearGradient>
<linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3f4"/><stop offset="0.55" stop-color="#3a8fc7"/><stop offset="1" stop-color="#1d4f7a"/></linearGradient>
<linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8f0c8"/><stop offset="0.5" stop-color="#5fa85a"/><stop offset="1" stop-color="#2d5b33"/></linearGradient>
<clipPath id="scr"><rect x="385" y="165" width="830" height="450" rx="6"/></clipPath></defs>
<rect x="360" y="140" width="880" height="500" rx="22" fill="#1b1b2f"/>
<g clip-path="url(#scr)">
  <rect x="385" y="165" width="830" height="450" fill="#8b8b97"/>
