<text x="460" y="580" font-size="26" font-weight="800" fill="#93939f" text-anchor="middle">ВЕСТИ</text>
<rect x="565" y="565" width="380" height="12" rx="6" fill="#93939f" opacity="0.8"/><rect x="975" y="565" width="200" height="12" rx="6" fill="#93939f" opacity="0.8"/><rect x="1065" y="189" width="120" height="56" rx="10" fill="#7f7f8c"/><text x="1125" y="227" font-size="28" font-weight="800" fill="#93939f" text-anchor="middle">ТВ 24</text></g>
  <g class="scene s3"><rect x="385" y="165" width="830" height="450" fill="url(#s3)"/><circle cx="1005" cy="275" r="56" fill="#fff6c8"/><path d="M385,545 L565,395 L715,505 L905,345 L1085,495 L1215,415 L1215,615 L385,615 Z" fill="#2d5b33"/></g>
  <g class="scene s2"><rect x="385" y="165" width="830" height="450" fill="url(#s2)"/><path d="M385,465 Q585,435 800,465 T1215,465 L1215,615 L385,615 Z" fill="#164466"/></g>
  <g class="scene s1"><rect x="385" y="165" width="830" height="450" fill="url(#s1)"/><circle cx="685" cy="415" r="80" fill="#ffd27a"/><path d="M385,545 L565,395 L715,505 L905,345 L1085,495 L1215,415 L1215,615 L385,615 Z" fill="#2a1f4d"/></g>
