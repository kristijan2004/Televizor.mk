<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
<rect width="1600" height="800" fill="#f4f4fa"/>
<text x="800" y="110" font-size="48" font-weight="800" fill="#1b1b2f" text-anchor="middle">Како да се заштитиш: три чекори</text>
<g>
<rect x="90" y="180" width="440" height="520" rx="24" fill="#ffffff" stroke="#d9d9e8" stroke-width="3"/>
<circle cx="310" cy="270" r="50" fill="#242582"/><text x="310" y="290" font-size="56" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="310" y="390" font-size="34" font-weight="800" fill="#1b1b2f" text-anchor="middle">Исклучи го ACR</text>
<text x="310" y="450" font-size="28" fill="#44445a" text-anchor="middle">Во поставките за</text>
<text x="310" y="490" font-size="28" fill="#44445a" text-anchor="middle">приватност, под имиња</text>
<text x="310" y="530" font-size="28" fill="#44445a" text-anchor="middle">како „Viewing Information“.</text>
<text x="310" y="590" font-size="28" fill="#44445a" text-anchor="middle">Провери повторно по</text>
<text x="310" y="630" font-size="28" fill="#44445a" text-anchor="middle">секое ажурирање.</text>
</g>
<g>
<rect x="580" y="180" width="440" height="520" rx="24" fill="#ffffff" stroke="#d9d9e8" stroke-width="3"/>
<circle cx="800" cy="270" r="50" fill="#242582"/><text x="800" y="290" font-size="56" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="800" y="390" font-size="34" font-weight="800" fill="#1b1b2f" text-anchor="middle">Исклучи ги</text>
<text x="800" y="432" font-size="34" font-weight="800" fill="#1b1b2f" text-anchor="middle">личните реклами</text>
<text x="800" y="500" font-size="28" fill="#44445a" text-anchor="middle">Тоа е посебна поставка,</text>
<text x="800" y="540" font-size="28" fill="#44445a" text-anchor="middle">најчесто на истото место</text>
<text x="800" y="580" font-size="28" fill="#44445a" text-anchor="middle">како и ACR.</text>
</g>
<g>
<rect x="1070" y="180" width="440" height="520" rx="24" fill="#ffffff" stroke="#d9d9e8" stroke-width="3"/>
<circle cx="1290" cy="270" r="50" fill="#1e8e4e"/><text x="1290" y="290" font-size="56" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="1290" y="390" font-size="34" font-weight="800" fill="#1b1b2f" text-anchor="middle">Најсигурно:</text>
<text x="1290" y="432" font-size="34" font-weight="800" fill="#1b1b2f" text-anchor="middle">без интернет</text>
<text x="1290" y="500" font-size="28" fill="#44445a" text-anchor="middle">Исклучи го телевизорот</text>
<text x="1290" y="540" font-size="28" fill="#44445a" text-anchor="middle">од Wi-Fi и гледај преку</text>
<text x="1290" y="580" font-size="28" fill="#44445a" text-anchor="middle">надворешен уред за</text>
<text x="1290" y="620" font-size="28" fill="#44445a" text-anchor="middle">стриминг.</text>
</g>
</svg>
